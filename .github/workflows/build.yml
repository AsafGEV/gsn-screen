name: Build GSNScreen APK v2.3-fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /opt/gradle
        echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

    - name: Create project dirs
      run: |
        mkdir -p GSNPlayer/app/src/main/java/com/gsn/screenplayer
        mkdir -p GSNPlayer/app/src/main/res/values
        mkdir -p GSNPlayer/app/src/main/res/drawable
        mkdir -p GSNPlayer/app/src/main/assets

    - name: Write Kotlin sources
      run: |
        printf '%s' '' | base64 -d > GSNPlayer/app/src/main/java/com/gsn/screenplayer/MainActivity.kt
        printf '%s' '' | base64 -d > GSNPlayer/app/src/main/java/com/gsn/screenplayer/BootReceiver.kt
        echo "Lines: $(wc -l < GSNPlayer/app/src/main/java/com/gsn/screenplayer/MainActivity.kt)"
        grep -c 'devMarker' GSNPlayer/app/src/main/java/com/gsn/screenplayer/MainActivity.kt && echo 'exact-match fix present'

    - name: Write project files
      run: printf '%s' '' | base64 -d | python3

    - name: Create keystore
      run: |
        keytool -genkeypair \
          -keystore keystore.jks \
          -alias gsnkey -keyalg RSA -keysize 2048 -validity 9999 \
          -storepass gsn2026 -keypass gsn2026 \
          -dname "CN=GSN,O=GSN,C=IL" -noprompt

    - name: Build APK
      run: gradle assembleRelease --no-daemon -p GSNPlayer

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GSNScreen-v2.3-fix
        path: GSNPlayer/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error