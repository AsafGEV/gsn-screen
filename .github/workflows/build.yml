name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Install Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/g.zip
        unzip -q /tmp/g.zip -d /opt/gradle
        echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH
    - name: Keystore
      run: |
        keytool -genkeypair -keystore keystore.jks -alias gsnkey -keyalg RSA \
          -keysize 2048 -validity 9999 -storepass gsn2026 -keypass gsn2026 \
          -dname "CN=GSN,O=GSN,C=IL" -noprompt
    - name: Build
      run: gradle assembleRelease --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: GSNScreen-APK
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
