<!DOCTYPE html>
<html dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>GSN</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05050f;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Arial,sans-serif;overflow:hidden}
.logo{font-size:90px;font-weight:900;letter-spacing:8px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0px)}50%{transform:translateY(-14px)}}
.g{color:#0057b8}.e{color:#00a651}.v{color:#f7941d}.a{color:#0057b8}
p{color:rgba(255,255,255,0.4);font-size:20px;letter-spacing:5px;margin-top:16px}
.bar{width:300px;height:3px;background:linear-gradient(90deg,#0057b8,#00a651,#f7941d);background-size:200%;animation:sw 2s linear infinite;border-radius:3px;margin-top:20px}
@keyframes sw{to{background-position:200% center}}
.dots{display:flex;gap:8px;margin-top:24px}
.dots i{width:9px;height:9px;border-radius:50%;background:#0057b8;display:block;animation:dp 1.5s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:0.2s}.dots i:nth-child(3){animation-delay:0.4s}
@keyframes dp{0%,80%,100%{transform:scale(0.6);opacity:0.3}40%{transform:scale(1.3);opacity:1}}
#did{position:fixed;bottom:20px;left:20px;font-size:13px;color:rgba(255,255,255,0.2);font-family:monospace}
</style></head><body>
<div class="logo"><span class="g">G</span><span class="e">E</span><span class="v">V</span><span class="a">A</span></div>
<p>&#x05e4;&#x05e8;&#x05e1;&#x05d5;&#x05dd; &#x05d7;&#x05db;&#x05dd;</p>
<div class="bar"></div><div class="dots"><i></i><i></i><i></i></div>
<div id="did"></div>
<script>function setDeviceId(id){document.getElementById("did").textContent="ID: "+id}</script>
</body></html>
