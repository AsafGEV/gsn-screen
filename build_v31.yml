name: Build GSNScreen APK v3.1
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Install Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/g.zip
        unzip -q /tmp/g.zip -d /opt/gradle
        echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH
    - name: Create dirs
      run: |
        mkdir -p GSNPlayer/app/src/main/java/com/gsn/screenplayer
        mkdir -p GSNPlayer/app/src/main/res/values
        mkdir -p GSNPlayer/app/src/main/res/drawable
        mkdir -p GSNPlayer/app/src/main/assets
    - name: Write Kotlin
      run: |
        printf '%s' '' | base64 -d > GSNPlayer/app/src/main/java/com/gsn/screenplayer/MainActivity.kt
        printf '%s' '' | base64 -d > GSNPlayer/app/src/main/java/com/gsn/screenplayer/BootReceiver.kt
    - name: Write project files
      run: printf '%s' '' | base64 -d | python3
    - name: Write icons
      run: printf '%s' '' | base64 -d | python3
    - name: Keystore
      run: keytool -genkeypair -keystore keystore.jks -alias gsnkey -keyalg RSA -keysize 2048 -validity 9999 -storepass gsn2026 -keypass gsn2026 -dname "CN=GSN,O=GSN,C=IL" -noprompt
    - name: Build
      run: gradle assembleRelease --no-daemon -p GSNPlayer
    - uses: actions/upload-artifact@v4
      with:
        name: GSNScreen-v3.1
        path: GSNPlayer/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
